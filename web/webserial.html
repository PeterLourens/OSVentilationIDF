<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="The front-end for configuration of the open source demand controlled ventilation system">
    <title>Open Source demand driven ventilation system &ndash; Configuration and Monitoring</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="pure_min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="layout">
        <!-- Menu toggle -->
        <a href="#menu" id="menuLink" class="menu-link">
            <!-- Hamburger icon -->
            <span></span>
        </a>

        <div id="menu">
            <div class="pure-menu">
                <div class="pure-menu-heading">OSVentilation</div>
                <ul class="pure-menu-list">
                    <li class="pure-menu-item"><a href="/" class="pure-menu-link">Status</a></li>
                    <li class="pure-menu-item"><a href="/settings" class="pure-menu-link">Settings</a></li>
                    <li class="pure-menu-item"><a href="/valvecontrol" class="pure-menu-link">Valve Control</a></li>
                    <li class="pure-menu-item"><a href="/sensorconfig" class="pure-menu-link">Sensors</a></li>
                    <li class="pure-menu-item"><a href="/statemachine" class="pure-menu-link">Statemachine</a></li>
                    <li class="pure-menu-item"><a href="/webserial" class="pure-menu-link">Webserial</a></li>
                    <li class="pure-menu-item"><a href="/stats" class="pure-menu-link">System stats</a></li>
                </ul>
            </div>
        </div>

        <div id="main">
            <div class="container">
                <H1>System Logs</H1>
            </div>
            <div class="container" style="height:700px;overflow:auto;" id="log">
            </div>
            <div class="container" id="footer" style="text-align: center;">
                <button class="pure-button-primary button-xsmall pure-button" onclick="Start()">Start</button>
                <button class="pure-button-primary button-xsmall pure-button" onclick="Stop()">Stop</button>
                <button class="pure-button-primary button-xsmall pure-button" onclick="SaveToFile()">Save</button>
                <button class="pure-button-primary button-xsmall pure-button" onclick="Clear()">Clear</button>
            </div>
        </div>
    </div>
    <script src="ui.js"></script>
    <script src="webserial.js"></script>
</body>

</html>
